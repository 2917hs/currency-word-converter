services:
  api:
    build:
      context: .
      dockerfile: Presentation/CurrencyConverter.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Cors__AllowedOrigins__0=http://localhost:8081

  client:
    build:
      context: Presentation/currency-converter-client
      args:
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "8081:80"
    depends_on:
      - api
